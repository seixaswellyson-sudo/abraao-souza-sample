<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#1d120c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Abraão Souza - Casa, Café e Contrato | Site conceito</title>
    <meta
      name="description"
      content="Site conceito (não oficial) de design para Abraão Souza, corretor de imóveis em Goiânia e Aparecida de Goiânia - CRECI 32.567 GO."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var redirect = sessionStorage.getItem("as:redirect");
        if (redirect) {
          sessionStorage.removeItem("as:redirect");
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <script>
      sessionStorage.setItem("as:redirect", location.pathname + location.search + location.hash);
      location.replace("/abraao-souza-sample/");
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
